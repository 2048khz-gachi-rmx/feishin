name: Publish

permissions:
    contents: write

on:
    workflow_dispatch:
    push:
        branches:
            - development
        paths:
            - package.json

jobs:
    version-changed:
        runs-on: ubuntu-latest
        outputs:
            changed: ${{ steps.check.outputs.changed }}
        steps:
            - name: Checkout git repo
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Compare package.json version with previous commit
              id: check
              env:
                  BEFORE: ${{ github.event.before }}
              run: |
                  current=$(jq -r .version package.json)
                  previous=$(git show "$BEFORE:package.json" 2>/dev/null | jq -r .version || echo "")
                  echo "current: $current, previous: $previous"
                  if [ -n "$current" ] && [ "$current" != "$previous" ]; then
                    echo "changed=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "changed=false" >> "$GITHUB_OUTPUT"
                  fi

    publish:
        needs: version-changed
        if: github.event_name == 'workflow_dispatch' || needs.version-changed.outputs.changed == 'true'
        runs-on: ${{ matrix.os }}

        strategy:
            matrix:
                os: [windows-latest, macos-26, ubuntu-latest]

        steps:
            - name: Checkout git repo
              uses: actions/checkout@v6

            - name: Install Node and PNPM
              uses: pnpm/action-setup@v4

            - name: Install dependencies
              run: pnpm install

            - name: Build and Publish releases (Windows)
              if: matrix.os == 'windows-latest'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              uses: nick-invision/retry@v3.0.2
              with:
                  timeout_minutes: 30
                  max_attempts: 3
                  retry_on: error
                  command: |
                      pnpm run publish:win
                  on_retry_command: pnpm cache delete

            - name: Build and Publish releases (macOS)
              if: matrix.os == 'macos-26'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              uses: nick-invision/retry@v3.0.2
              with:
                  timeout_minutes: 30
                  max_attempts: 3
                  retry_on: error
                  command: |
                      pnpm run publish:mac
                  on_retry_command: pnpm cache delete

            - name: Build and Publish releases (Linux)
              if: matrix.os == 'ubuntu-latest'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              uses: nick-invision/retry@v3.0.2
              with:
                  timeout_minutes: 30
                  max_attempts: 3
                  retry_on: error
                  command: |
                      pnpm run publish:linux
                  on_retry_command: pnpm cache delete

            - name: Build and Publish releases (Linux ARM64)
              if: matrix.os == 'ubuntu-latest'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              uses: nick-invision/retry@v3.0.2
              with:
                  timeout_minutes: 30
                  max_attempts: 3
                  retry_on: error
                  command: |
                      pnpm run publish:linux-arm64
                  on_retry_command: pnpm cache delete
